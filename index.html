<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1,viewport-fit=cover">

    <title>Forum Komunikasi Warga PTKA 2026</title>

    <meta name="theme-color" content="#111111">

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<!-- =========================
     LOADING
========================== -->

<div id="loading">

    <div class="loader"></div>

    <h2>Memuat Presentasi...</h2>

</div>

<!-- =========================
     COVER
========================== -->

<section id="cover">

    <div class="cover-bg"></div>

    <div class="overlay"></div>

    <div class="content">

        <div class="logo-circle">

            🛕

        </div>

        <h3>FORUM KOMUNIKASI WARGA</h3>

        <h1>

            PTKA 2026

        </h1>

        <p>

            Bali dan Nusantara

        </p>

        <button id="startBtn">

            ▶ Mulai Presentasi

        </button>

    </div>

</section>

<!-- =========================
     VIEWER
========================== -->

<section id="viewer">

    <div id="slideArea">

        <img
            id="slide"
            draggable="false"
            alt="Slide Presentasi">

    </div>

    <div id="info">

        <span id="judul">

            Forum Komunikasi Warga PTKA 2026

        </span>

        <span id="nomor">

            1 / 31

        </span>

    </div>

    <div id="menu">

        <button
            id="prevBtn"
            onclick="prevSlide()">

            ⏮

        </button>

        <button
            id="nextBtn"
            onclick="nextSlide()">

            ⏭

        </button>

        <button
            id="fullscreenBtn"
            onclick="toggleFullscreen()">

            ⛶

        </button>

    </div>

</section>

<audio id="music" loop>

    <source
        src="assets/audio/backsound.mp3"
        type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
